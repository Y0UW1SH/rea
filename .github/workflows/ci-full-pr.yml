name: Full PR qualification

on:
  pull_request:
    branches: [main, "release/*"]
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  qualification:
    name: Qualify labeled PR revision
    if: ${{ github.repository != 'Y0UW1SH/rea' && (github.event.label.name == 'ci:full') }}
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.sha }}
